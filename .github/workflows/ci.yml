name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  sanity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repo files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f .gitignore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check diffs
        run: git diff --check